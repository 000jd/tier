name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit test suite
        run: python -m unittest discover -s tests -q

      - name: Lint TIER documents
        shell: bash
        run: |
          tier lint SPEC.tier
          tier lint repo.tier
          tier lint examples/payments-runbook.tier
          tier lint examples/handbook.tier

      - name: Verify repo.tier is in sync
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tier sync repo.tier
          tier sync repo.tier --rehash
          if ! git diff --exit-code -- repo.tier; then
            echo "::error file=repo.tier::repo.tier is stale. Run 'tier from-repo . -o repo.tier' and commit the result."
            exit 1
          fi
          tier doctor .
